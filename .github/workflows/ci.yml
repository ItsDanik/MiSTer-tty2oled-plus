# Every push: the test suites, and the firmware for all three boards.
# A v* tag: the same, then a GitHub release built from them.
#
# The release is what tools/update_tty2oledplus.sh installs from, so this
# is the only way a build reaches anyone who does not have the repository.
# The procedure that ends in a tag push is at the top of CLAUDE.md.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run's answer moot. Never
# cancel a tag's run: that is a release half-published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # The ESP32 core the firmware is built with - here and, by agreement, on the
  # workstation (arduino-cli core list). The core is most of the binary, so
  # moving this is a firmware change: do it on purpose, in its own commit, and
  # flash the result before tagging.
  ESP32_CORE_VERSION: "3.3.12"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # inotify-tools turns the one skipped daemon check into a real one;
      # ImageMagick lets png2gsc be tested on both of its backends.
      - name: Install what the suites use
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inotify-tools imagemagick python3-pil xxd shellcheck

      - name: Run every suite
        run: ./tests/run-all.sh

      # Errors only. Warnings are mostly the cross-file globals every script
      # here shares with the ini it sources, and gating on them would mean
      # rewriting upstream's code first.
      - name: Shellcheck
        run: >
          shellcheck -S error -s bash
          tty2oled.sh tty2oled-meta.sh tty2oled-read.sh S60tty2oled
          tools/*.sh tests/*.sh

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [lolin32, esp32de, esp32s3]
    steps:
      - uses: actions/checkout@v4

      # The core alone is about a gigabyte. Keyed on its version and on the
      # build script, which decides the libraries.
      - name: Cache the ESP32 core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
            ~/.local/bin/arduino-cli
          key: arduino-esp32-${{ env.ESP32_CORE_VERSION }}-${{ hashFiles('tools/build-tty2oled.sh') }}
          restore-keys: arduino-esp32-${{ env.ESP32_CORE_VERSION }}-

      - name: Build
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          ./tools/build-tty2oled.sh MiSTer_SSD1322_USB "${{ matrix.board }}"

      - name: Keep the image
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.board }}
          path: MiSTer_SSD1322_USB/build-out-${{ matrix.board }}/MiSTer_SSD1322_USB.ino.merged.bin
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Lands as fw/fw-<board>/..., which make-release reads the board from.
      - name: Fetch the firmware built above
        uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: fw

      # The index is generated and gitignored, so the release builds its own.
      - name: Cache the title index sources
        uses: actions/cache@v4
        with:
          path: .index-cache
          key: index-cache-${{ hashFiles('tools/build-title-index.sh', 'tools/*.awk') }}
          restore-keys: index-cache-

      - name: Build the title index
        run: ./tools/build-title-index.sh

      # Refuses a tag that is not VERSION, a version with no CHANGELOG section,
      # and a firmware image too small to be one.
      - name: Assemble the release
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/make-release.sh --tag "${TAG}" --firmware fw --notes notes.md

      # Not --prerelease, whatever the "b" says. GitHub leaves pre-releases out
      # of /releases/latest, and that is the address the installer and every
      # update_tty2oledplus fetch from - a beta marked as one would be
      # invisible to all of them.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" dist/* \
            --title "tty2oled+ ${TAG#v}" \
            --notes-file notes.md \
            --latest \
            --verify-tag
