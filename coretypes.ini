# tty2oled+ core type map
#
#   <corename>=arcade|console|computer
#
# The corename is what MiSTer writes to /tmp/CORENAME - NOT the .rbf filename.
# tools/tty2oled-diag.sh prints the one your MiSTer actually reports.
#
# classify_core() consults this BEFORE guessing from the _Console / _Computer
# folder the core was started from, so an entry here is final. That matters
# because the folder guess needs /tmp/STARTPATH, and a core that does not
# publish one classifies as "unknown" - which turns the metadata display off
# and leaves the full-screen artwork up with no game ever shown.
#
# Arcade cores are detected from the .mra in STARTPATH and never need a line.
#
# This file is only copied to the MiSTer when one is not already there, so
# your edits survive a deploy.

