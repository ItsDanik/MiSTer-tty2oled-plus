# tty2oled+ settings.
#
# Copyright (c) 2021/2022 ojaksch, venice - GPLv3, like the rest of the fork.
# Upstream's own v1.0-v2.7 changelog for this file lived here; it described
# options that went with upstream's updaters, and this fork keeps its history
# in CHANGELOG.md.
#
# Everything above "the lines above are the system settings" is machinery.
# Everything below it is yours to change - but change it in
# tty2oled-user.ini, which is sourced after this file and is never
# overwritten by an update.

# Debugging
debug="false"
debugfile="/tmp/tty2oled"

# FORK NOTE
# The upstream installer and the two update scripts are not part of this fork -
# they exist to pull venice1200's scripts and tty2tft.de's stock firmware over
# a local install, which is the one thing a fork must not let happen. Install
# with tools/deploy-mister.sh instead. Everything they configured
# (REPOSITORY_URL, PICTURE_REPOSITORY_URL, UPDATESCRIPT, AUTOUPDATE,
# SCRIPT_UPDATE, TTY2OLED_UPDATE, MOUNTRO) went with them.

# tty2oled+ version. Written by tools/bump-version.sh from the VERSION file at
# the repo root, and always the same number as the firmware's BuildVersion -
# the daemon compares the two at startup and says so if they differ.
TTY2OLED_VERSION="0.8.1b"

TTY2OLED_PATH="/media/fat/tty2oledplus"
INITSCRIPT="${TTY2OLED_PATH}/S60tty2oled"
DAEMONNAME="tty2oled.sh"
DAEMONSCRIPT="${TTY2OLED_PATH}/tty2oled.sh"
USERSTARTUP="/media/fat/linux/user-startup.sh"
USERSTARTUPTPL="/media/fat/linux/_user-startup.sh"
SLEEPFILE="/tmp/tty2oled_sleep"
corenamefile="/tmp/CORENAME"
# A newer release has been found: the daemon writes its version here, and the
# updater removes it once it has installed one. In /tmp, so a reboot forgets it
# and the check at startup decides again.
UPDATE_FLAG="/tmp/tty2oledplus_update"

# Where S60tty2oled records the running daemon. Its own path, not upstream's:
# this fork is built to sit beside an upstream install, and both writing
# /run/tty2oled-daemon.pid meant a live upstream daemon could stop ours from
# starting, and our "stop" could kill theirs. S60tty2oled still looks at the
# old path as well, so a daemon started by an earlier version of this script is
# found - safely, because it confirms the process is running our own script
# before touching it.
PIDFILE="/run/tty2oledplus-daemon.pid"
# Where the daemon's own output goes. S60tty2oled detaches it from whoever
# started it, so it has no terminal to write to; debug output is still
# ${debugfile}.
DAEMONLOG="/tmp/tty2oled-daemon.log"
# All the artwork lives under one folder, one kind per subfolder, in lower
# case. pics_pri is gone; so are pics/GSC, pics/ICON and pics/alt.
#
#   pics/banner  256x64 banners of console and computer cores, named by core
#   pics/icon    86x64 console icons for the split layout, named by core
#   pics/user    256x64 banners of your own, named by core or arcade set
#   pics/arcade  arcade wheel logos, packed: wheels.bin is the pictures,
#                wheels.idx which set is which picture
#
# banner, icon and arcade are the release's and are replaced by every update.
# user is yours and is never touched by one - that is the whole point of it.
picturefolder="${TTY2OLED_PATH}/pics"
bannerfolder="${picturefolder}/banner"
userbannerfolder="${picturefolder}/user"
wheelpack="${picturefolder}/arcade/wheels.bin"
wheelindex="${picturefolder}/arcade/wheels.idx"

# Game metadata display (fork)
iconfolder="${picturefolder}/icon"
CORETYPE_MAP="${TTY2OLED_PATH}/coretypes.ini"

# What Scrape metadata imported from your gamelist.xml files - one file per
# system, written on this MiSTer and never by an update.
SCRAPE_DIR="${TTY2OLED_PATH}/scraped"

# What ScummVM's own icon packs say about its games - the index and each
# game's icon at 86x64 - built on this MiSTer from ScummVM's files the first
# time they are wanted. Deleting it only costs building it again.
SCUMMVM_CACHE="${TTY2OLED_PATH}/cache/scummvm"

WAITSECS="0.2"				# Wait after a picture header, before the bytes follow
CMDWAITSECS="0.05"			# Wait after a single-line command. The firmware acks
					# after cDelay, which is 15ms, so 0.2 was pure boot time:
					# the startup handshake alone spent over a second of it
					# in front of the first picture.
TTYWAIT="2"				# Seconds between checks while the display is unplugged.
					# The daemon keeps running without one and re-initialises
					# the panel when the device node comes back.
CORENAME_WAIT="5"			# Longest wait for MiSTer to publish ${corenamefile}.
					# Only reached at boot, when the daemon can start before
					# MiSTer's Main has written it.
META_WIRE_LAST=""			# Last CMDMETA line sent, so identical ones are not resent
newcore=""
oldcore=""

################ The lines above are the system settings. Only edit in case
#		 you know what you are doing!

################ The lines below are the user settings. Instead of editing
#		 them, please copy the one(s) to tty2oled-user.ini and edit
#		 them there.

# Serial
BAUDRATE="115200"
TTYDEV="/dev/ttyUSB0"
TTYPARAM="cs8 raw -parenb -cstopb -hupcl -echo"

# Userdata
ROTATE="no"					# Set to "yes" if you want the Display rotated by 180 degrees
CONTRAST="255"					# Panel brightness, 0..255. Changes fade over CONTRAST_FADE_MS
CONTRAST_FADE_MS="800"				# How long any brightness change takes, 0..4000 ms; 0 jumps.
					# Going dim has its own, DIM_FADE_MS, below
# The artwork is 4bpp greyscale .gsc pictures. A console or computer core's
# is its banner in pics/banner, named after the core. An arcade core's is its
# game's wheel logo out of the pack in pics/arcade, found by the MRA's set
# name - whole, never a near match - and one the pack does not have shows the
# name as text.
#
# Drop a .gsc named after the core, or after the arcade set, into pics/user
# to replace one. An update never touches that folder, so your own artwork
# survives every release - which pics_pri used to do, and which editing
# pics/banner does not.
PRIORITIZE_USER_BANNERS="yes"			# Look in pics/user before the shipped artwork. "no"
					# searches it first and treats pics/user as the fallback
# How one picture replaces the last - on a core change, and between the pages
# of the arcade info card:
#   -2  Fade: the old picture fades out, the panel stays black for
#       TRANSITION_BLANK_MS, the new one fades in (TRANSITION_FADE_MS each way).
#       Brightness and the picture's own grey levels fade together, in 16
#       steps, so it really does reach black
#   -1  a different wipe at random every time
#    0  none - the new picture simply appears
#    1  Left to right                     13  Slide in, right to left
#    2  Top to bottom                     14  Slide in, bottom to top
#    3  Right to left                     15  Top and bottom to the middle
#    4  Bottom to top                     16  Left and right to the middle
#    5  Alternate lines, opposite ways    17  Middle out to top and bottom
#    6  Top half right, bottom half left  18  Middle out to left and right
#    7  Four bands, alternating           19  Warp, middle out to every edge
#    8  Four quarters, crosswise          20  Clockwise sweep
#    9  Particles                         21  Shaft
#   10  Diagonal, left to right           22  Waterfall
#   11  Slide in, left to right           23  Chessboard of 8 squares
#   12  Slide in, top to bottom
#
#  The fade-slides: a Fade that drifts the picture as it goes, out one edge
#  and in from the other. "1" moves it a pixel per step and "2" two, which
#  over the sixteen steps is 16 or 32 pixels of travel each way:
#   30  Fade, sliding left               35  Fade, sliding up fast
#   31  Fade, sliding left fast          36  Fade, sliding down
#   32  Fade, sliding right              37  Fade, sliding down fast
#   33  Fade, sliding right fast         38  Fade, sliding a random way
#   34  Fade, sliding up                 39  Fade, sliding a random way fast
TRANSITION="30"

# The boot screen doubles as the menu's picture. At power-on it simply stays:
# when the daemon connects, the loading bar finishes its sweep and the version
# fades out, leaving the picture above an empty band - no fade out and back
# in to show the menu. Returning to the menu from a core transitions to it
# like any other core picture. "no" shows MENU.gsc from the artwork pack.
#
# The frontends - the menu, MisterZine, Degauss and Zaparoo - keep that band:
# their picture is the top 54 rows, and the 10 below are for the display's own
# notices (UPDATE_NOTE_TEXT). A 256x64 banner of theirs, in pics/banner or
# pics/user, is shown cut down to its top 54 rows; draw them 256x54.
BOOTSCREEN_AS_MENU="yes"

# While update_all runs, show update_all.gsc over whatever core is loaded -
# including a frontend core it was started from - and go back to the core when
# it exits. Looked for as update_all.gsc in pics/user, then pics/banner - by
# that exact name; with none the display shows "update_all" as text. The picture is
# cropped to its top 54 rows, and while update_all's downloader is running -
# the update itself, not the settings screen - the boot screen's sweep runs in
# the 10 rows below. Detected by process, checked every UPDATE_ALL_POLL
# seconds (a grep over /proc). While the downloader runs the picture is
# replaced by UPDATE_ALL_TEXT above the bar, so the panel says what is
# happening; the picture comes back when the download ends.
# MiSTer's own updater, Scripts/update.sh - what Zaparoo's Update runs - gets
# the same screens, all of it the label and bar (it is all download), its
# line from the Downloader's own log and its finish from downloader.log.
# UPDATE_ALL_POLL is also how often the menu looks for the Degauss frontend,
# which runs over the menu core without changing CORENAME: while it runs the
# display shows degauss.gsc (pics/user, then pics/banner, exact name) or
# "degauss" as text, as it does for any core. Zaparoo's frontend, on its own
# menu core, is shown the same way, as zaparoo.gsc or "zaparoo".
UPDATE_ALL_SCREEN="yes"
UPDATE_ALL_POLL="2"
UPDATE_ALL_TEXT="Updating System ..."

# Under UPDATE_ALL_TEXT, in small grey letters, the last line update_all has
# printed on the MiSTer's own screen - the database being checked, the file
# being fetched - read once a second from /tmp/update_all_print.log while the
# bar runs. From "Sequence:" to the end the update keeps the panel, not just
# while the downloader runs. Needs firmware 0.7.0b or later, and an update_all
# that writes that file (2.x).
UPDATE_ALL_DETAILS="yes"

# When an update finishes - update_all, or tty2oled+'s own - the label becomes
# UPDATE_DONE_TEXT (UPDATE_FAILED_TEXT if it went wrong), the bar runs off and
# stops, and the screen stays at least UPDATE_DONE_SECS: longer if update_all
# is still up (its log viewer), never less even if it has already exited.
# 0 goes straight back to the core as before. Firmware 0.7.0b or later.
UPDATE_DONE_TEXT="Update Complete"
UPDATE_FAILED_TEXT="Update Failed"
UPDATE_DONE_SECS="3"

# The same, for this fork's own updater - Update in the tty2oledplus Scripts
# menu entry. It stops the daemon within seconds of starting and drives the
# panel itself from there: SELF_UPDATE_TEXT with the bar under it and each
# step on the status line - downloading, installing, and a warning before the
# firmware is flashed, when the panel freezes and restarts - then the finish.
SELF_UPDATE_SCREEN="yes"
SELF_UPDATE_TEXT="Updating TTY2OLED+..."

# Updates waiting, said under the picture of the menu, MisterZine, Degauss
# and Zaparoo in small grey letters - the 10 rows kept for the display's own
# messages.
# Both are looked for when the daemon starts - at boot - and every
# UPDATE_CHECK_MINUTES after that, in the background; 0 never looks. Offline,
# a check is tried again every 5 minutes. Firmware 0.7.1b or later.
#
#   UPDATE_CHECK_TTY2OLED  a newer tty2oled+ release on GitHub. Looked for no
#                          more once found, until Update in the tty2oledplus
#                          Scripts entry has installed it.
#   UPDATE_CHECK_SYSTEM    something update_all would update: each of its
#                          databases is compared with the one it last applied,
#                          and a changed one with what you have installed from
#                          it - so a new build of a core you have, a changed
#                          file, a new Linux; not cores your filter leaves out.
#                          Looked for no more once found, until update_all has
#                          run. The downloads are small, and skipped when
#                          GitHub says nothing has changed.
UPDATE_CHECK_TTY2OLED="yes"
UPDATE_CHECK_SYSTEM="yes"
UPDATE_CHECK_MINUTES="30"
UPDATE_NOTE_TEXT="TTY2OLED+ Update Available"
UPDATE_NOTE_SYSTEM_TEXT="System Update Available"
UPDATE_NOTE_BOTH_TEXT="TTY2OLED+ & System Update Available"

# When no update is waiting, the same place - under the picture of the menu,
# MisterZine, Degauss and Zaparoo - shows the date and the time, small and
# grey: BAND_CLOCK_LEFT at the left edge, BAND_CLOCK_RIGHT at the right. Each
# is a strftime format: %d day, %m month, %y year (%Y with the century), %b
# the month's name, %a the day's; %H:%M the time, %I:%M %p for 12 hours. One
# left empty leaves that side blank. A notice takes the place over while an
# update waits; the busy bar while one runs. The time is the MiSTer's, in its
# own time zone, sent at start and every hour. Firmware 0.7.8b or later.
BAND_CLOCK="yes"
BAND_CLOCK_LEFT="%d/%m/%y"
BAND_CLOCK_RIGHT="%H:%M"
TRANSITION_FADE_MS="400"			# Fade (-2) only: each fade, out and in, 0..4000 ms
TRANSITION_BLANK_MS="1000"			# Fade (-2) only: black between them, 0..4000 ms
# Sleep mode. Another program can claim the display by creating
# /tmp/tty2oled_sleep, and this daemon then leaves the serial port alone until
# it is removed. MiSTer SAM does this: it drives the panel itself for the whole
# of an attract session, so the file is a mutex rather than a preference.
#
# SLEEPMODEDELAY is the settling delay *after* the file goes, not a poll
# interval - at that moment the holder is still finishing up and /tmp/CORENAME
# may name a core that is on its way out.
#
# SAM writes an epoch deadline into the file and rewrites it on every game
# change. A holder that is killed or crashes leaves the file behind, and the
# display would then stay frozen for ever; SLEEP_STALE_GRACE is how long past
# that deadline to wait before assuming the holder is gone and taking the
# display back. Generous on purpose: the deadline only covers the game that was
# running when it was written, so it falls due during any slow core load while
# SAM is perfectly healthy. A file with no number in it - a plain "touch" -
# has no deadline and is waited on for ever, as before.
SLEEPMODEDELAY="2"				# Settling delay after the display is handed back
SLEEP_POLL="5"					# Seconds between re-reading the deadline while asleep
SLEEP_STALE_GRACE="60"				# Grace past the deadline before taking the display back

# --- Game metadata display (fork) ---
# Requires "log_file_entry=1" in MiSTer.ini. MiSTer's config defaults that
# option to off, and without it MiSTer never writes /tmp/STARTPATH,
# /tmp/FULLPATH or /tmp/GAMEID and only core-level display is possible.
SHOW_METADATA="yes"				# Master switch for the metadata display
METADATA_INTERVAL="12"				# Seconds per page, console and arcade (0 = never turn)
						# Arcade: artwork, then each page of the card in turn,
						# then the artwork again. Console: each page of fields
						# in turn. Either way the description page, when there
						# is one, stays as long as its text takes to scroll through.
METADATA_WARN="yes"				# Warn once at startup if log_file_entry is not enabled
METADATA_POLL="5"				# Seconds before re-checking for state files that did not exist yet

# A console core launched with its game already chosen - from a frontend, or a
# .mgl entry - used to go straight to the game's split layout, so the core's
# own full-screen artwork was never seen. This holds it first, the way a
# console holds its own boot screen before the game starts, then the layout
# replaces it. Milliseconds, up to 10000.
#
# The hold is measured from the moment the artwork is actually on the panel,
# so it is not eaten by the transition in front of it.
#
# 0 turns it off: the layout appears at once, as it did before 0.5.1b. A game
# loaded into a core that is already running is unaffected either way - the
# artwork has been on screen all along, and there is nothing to introduce.
core_bootscreen_time="3000"

# Which console fields to show, and in what order. The split layout has four
# rows and pages through the rest every METADATA_INTERVAL seconds, so the
# first four listed are the ones seen at a glance. Available: System Region Year Company Genre Developer
# Format Platform Engine Language Players Rating Released Series. Platform,
# Engine and Language are ScummVM's - which runs its games through this
# layout too - and no console game has them. The last four come only from
# Scrape metadata - a game it has not looked up has none of them, and its
# pages are simply not there. Leave empty for all fourteen. Arcade cores are
# unaffected.
METADATA_FIELDS="System Year Genre Region Format Platform Engine Language Players Rating Released Series"

# A game Scrape metadata imported a description for gets one more page after
# its fields: the description, scrolling up under the title until all of it
# has gone past. On a console that is a page of the split layout; on the
# arcade card it is the card's last page, before the artwork comes back.
# "no" leaves it out of both.
SHOW_DESCRIPTION="yes"

# While MiSTer SAM's Super Attract Mode is playing games by itself, the
# header above a game's details says SAM_HEADER_TEXT instead of "Now playing"
# - nothing else changes. It goes back once SAM stops, the game you took over
# included. Up to 24 characters. Needs firmware 0.7.7b or later.
SAM_HEADER="yes"
SAM_HEADER_TEXT="Super Attract Mode"
# ...and after it, how long until SAM moves on to its next game - "0:42" -
# counted from when the game was launched with SAM's own gametimer (from
# MiSTer_SAM.ini; 21 seconds in M82 mode). Needs firmware 0.7.8b or later.
SAM_TIMER="yes"

# How fast things move, in pixels a second - bigger is faster. The title
# marquee is horizontal, 25 being a pixel every 40ms; the description is
# vertical, 6 being a pixel every 166ms. 1 to 200 and 1 to 100.
HSCROLL_SPEED="25"
VSCROLL_SPEED="6"

# Fields that stay put while the rest cycle underneath, below the title - which
# is always there. The layout has four rows, so one pinned leaves three
# paging: System stays, and Year is seen once, on the first page. Names must
# also be in METADATA_FIELDS.
METADATA_PINNED="System"

# The arcade card, which comes from the .mra. Two lists, because the values
# are two shapes. ARCADE_FIELDS holds the short ones: they pair up two to a
# row, reading across, and four rows of them fill a page.
#
#     Year     1993          Manufctr  Midway
#     Players  4             Rating    8/10
#     Developr Midway        Region    World
#     Orient   Horizontal    Core      blahmid_tunit
#
#     Author   rejectedcoins Set       nbajam
#     MAME     0289
#
# ARCADE_FIELDS_WIDE holds the long ones, which get a row each on the page
# after them, under a repeat of the pinned row:
#
#     Year     1993          Manufctr  Midway
#     Controls 8-way
#     Buttons  Turbo/Shoot / Block/Pass / Steal
#
# Either list may name: Year Manufacturer Genre Players Controls Buttons
# Region Platform Orientation Set Core MAME Version Author Developer Publisher
# Rating Released Series. A field the .mra does not carry is simply not shown,
# and the pages shrink to fit. Genre, Platform and Version are off by default;
# Genre belongs in the wide list, "Fighter / 2.5D" does not fit half a row.
# Developer, Publisher, Rating, Released and Series come from the
# games/mame/gamelist.xml that Scrape metadata imported for Arcade, which also
# fills Year, Manufacturer, Genre and Players where the .mra has none.
# Console cores are unaffected.
ARCADE_FIELDS="Year Manufacturer Players Rating Developer Region Orientation Core Author Set MAME"
ARCADE_FIELDS_WIDE="Controls Buttons"

# The grid row repeated above each wide page. Must be the first names in
# ARCADE_FIELDS: it is the top row of the grid, and a row cannot start
# halfway down the list. Empty gives the wide page all four rows.
ARCADE_PINNED="Year Manufacturer"

# Fold the publisher into the year - "Year 1989, Acclaim" on one row instead
# of two. "no" keeps them as separate Year and Company rows.
COMPACT_YEAR_COMPANY="yes"

# Where your games live. MiSTer reports paths relative to the SD card, but a
# ROM set can be installed on the SD or on USB, so both are searched in order.
# Only used to recover a file extension MiSTer did not report; add your own
# mount point here if you keep games somewhere else.
GAME_ROOTS="/media/fat /media/usb0 /media/usb1 /media/usb2 /media/usb3 /media/usb4 /media/usb5 /media/usb6 /media/usb7 /media/fat/cifs"

# Idle dimming. After DIM_AFTER seconds with nothing new on screen the panel
# fades down to DIM_CONTRAST; the next thing the MiSTer sends - a core change,
# a game, any command - fades it back up. Going down takes DIM_FADE_MS, slow
# enough that nobody notices it happen; coming back takes CONTRAST_FADE_MS.
# This is separate from SCREENSAVER above, which moves a logo around instead,
# and the two can be used together.
#
#   DIM_CONTRAST is a brightness on the same 0..255 scale as CONTRAST, not a
#   share of it, and is never allowed above the waking level. It replaces
#   DIM_PERCENT, which was a percentage of CONTRAST: set that in
#   tty2oled-user.ini and the daemon says so in its log and ignores it.
#
#   DIM_AFTER=0     never dim
#   DIM_WAKE=-1     wake to CONTRAST, as set above
DIM_AFTER="120"
DIM_CONTRAST="80"
DIM_FADE_MS="6000"				# How long going dim takes, 0..10000 ms
DIM_WAKE="-1"

# Swap the console layout's sides every FLIP_MINUTES so no region of the panel
# holds the same lit pixels indefinitely: icon left and text right, then back.
# 0 never swaps.
FLIP_MINUTES="5"

# Show cores by the name you gave them in MiSTer's names.txt rather than the
# core's internal name - "Nintendo GameBoy Advance" instead of "GBA", matching
# what the MiSTer menu itself shows. Falls back to the core name when there is
# no names.txt or no entry for the core.
USE_NAMES_TXT="yes"
NAMES_TXT="/media/fat/names.txt"

# Title index: CRC32 -> canonical title, year, publisher, genre, developer.
# MiSTer writes the CRC32 of the loaded ROM to /tmp/GAMEID; a hit here replaces
# the filename-derived title and fills in what a filename cannot say. One file
# per core name, built on the workstation by tools/build-title-index.sh from
# libretro-database and copied over with deploy-mister.sh --index.
# Entirely optional - without it the display falls back to the filename.
TITLE_INDEX_DIR="${TTY2OLED_PATH}/titleindex"
TITLE_INDEX="${TTY2OLED_PATH}/titleindex.txt"	# legacy single-file index, used only if no per-core file
